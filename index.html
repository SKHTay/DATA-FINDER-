<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Finder</title>
<meta name="description" content="Recensez vos actifs de données, identifiez de nouveaux usages et décidez où agir en priorité.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app">
  <div class="app-in">
    <div class="marque">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="19" width="5" height="8" rx="1" fill="#5C3EC2"/>
        <rect x="13.5" y="13" width="5" height="14" rx="1" fill="#4EC9B0"/>
        <rect x="23" y="5" width="5" height="22" rx="1" fill="#B8E04A"/>
      </svg>
      Data Finder
    </div>
    <div class="droite" id="enTeteDroite"></div>
  </div>
</header>

<div class="coque">
  <nav class="rail" id="rail" aria-label="Navigation principale" hidden></nav>
  <main id="app">
    <noscript><p style="margin-top:32px">Data Finder effectue ses calculs dans le navigateur.
      Activez JavaScript pour l'utiliser.</p></noscript>
  </main>
</div>

<nav class="bas" id="railBas" aria-label="Navigation principale" hidden></nav>

<footer class="pied"><div>
  Data Finder fonctionne sans serveur. Votre travail est enregistré dans ce navigateur, sur ce poste,
  et n'est jamais transmis. Les données fournies en exemple sont fictives : aucun contenu patient,
  aucune donnée réelle d'établissement.
</div></footer>

<script src="moteur.js"></script>
<script src="ancres.js"></script>
<script src="libelles.js"></script>
<script src="cas.js"></script>
<script src="persistance.js"></script>
<script src="interface.js"></script>
</body>
</html>
